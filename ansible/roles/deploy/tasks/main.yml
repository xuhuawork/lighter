---
- name: 检查 NVM 是否已安装
  shell: test -d ~/.nvm && echo "installed" || echo "not installed"
  register: nvm_check
  changed_when: false

- name: 下载并安装 NVM
  shell: >
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
  args:
    creates: "~/.nvm/nvm.sh"
  when: nvm_check.stdout == "not installed"

- name: 设置 NVM 环境变量
  lineinfile:
    path: "~/.bashrc"
    line: "{{ item }}"
    state: present
  with_items:
    - 'export NVM_DIR="$HOME/.nvm"'
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
    - '[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"'
  when: nvm_check.stdout == "not installed"

- name: 安装 Node.js v22
  shell: >
    source ~/.nvm/nvm.sh && nvm install 22
  args:
    executable: /bin/bash
  register: node_install
  changed_when: node_install.rc == 0
  failed_when: node_install.rc != 0

- name: 设置 Node.js v22 为默认版本
  shell: >
    source ~/.nvm/nvm.sh && nvm alias default 22
  args:
    executable: /bin/bash
  register: node_default
  changed_when: node_default.rc == 0
  failed_when: node_default.rc != 0

- name: 确保项目目录存在
  file:
    path: "~/Projects"
    state: directory
    mode: '0755'

- name: 确保lighter项目目录存在
  file:
    path: "~/Projects/lighter"
    state: directory
    mode: '0755'

- name: 复制项目文件到远程服务器
  synchronize:
    src: "{{ playbook_dir }}/../"
    dest: ~/Projects/lighter
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.git"
      - "--exclude=ansible"
  register: sync_result
  retries: 3
  delay: 5
  until: sync_result is success

- name: 创建日志目录
  file:
    path: ~/Projects/lighter/logs
    state: directory
    mode: '0755'

- name: 确保 .dockerignore 文件包含正确的内容
  copy:
    dest: ~/Projects/lighter/.dockerignore
    content: |
      # 依赖目录
      node_modules
      npm-debug.log

      # 版本控制
      .git
      .gitignore

      # 环境配置
      .env
      .env.*

      # 开发和测试文件
      test
      *.test.js
      *.spec.js

      # 日志文件
      logs
      *.log

      # 系统文件
      .DS_Store
      Thumbs.db

      # Nginx 和 Certbot 相关目录
      nginx/certbot
    mode: '0644'

- name: 确保 nginx/certbot 目录结构存在
  file:
    path: "~/Projects/lighter/{{ item }}"
    state: directory
    mode: '0755'
    recurse: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  with_items:
    - "nginx/conf"
    - "nginx/certbot/conf"
    - "nginx/certbot/www"

- name: 停止正在运行的 Docker Compose 服务
  shell: cd ~/Projects/lighter && docker compose down
  args:
    chdir: ~/Projects/lighter
  register: docker_compose_down
  changed_when: docker_compose_down.rc == 0
  failed_when: false

- name: 移除 lighter-app 镜像
  shell: docker rmi $(docker images -q lighter-app) || true
  args:
    chdir: ~/Projects/lighter
  register: remove_image
  changed_when: remove_image.rc == 0
  failed_when: false

- name: 重新构建 Docker 镜像
  shell: cd ~/Projects/lighter && docker compose build --no-cache
  args:
    chdir: ~/Projects/lighter
  register: docker_compose_build
  retries: 2
  delay: 3
  until: docker_compose_build is success

- name: 启动 Docker Compose 服务
  shell: cd ~/Projects/lighter && docker compose up -d
  args:
    chdir: ~/Projects/lighter
  register: docker_compose_up
  retries: 2
  delay: 3
  until: docker_compose_up is success

- name: 检查服务状态
  shell: cd ~/Projects/lighter && docker compose ps
  args:
    chdir: ~/Projects/lighter
  register: service_status
  changed_when: false

- name: 显示服务状态
  debug:
    var: service_status.stdout_lines 