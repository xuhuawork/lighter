<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火机流浪史</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container history-container larger-font">
        <h1 class="pixel-text">
            <span class="pixel-icon">🔥</span> 打火机 #<span id="lighterNumber"></span> 的流浪史
        </h1>
        <div id="historyList"></div>
        <p class="pixel-text history-note">
            ⚠️ <br>
            没的办法，<br>
            导演只想让你看到5条留言<br>
            实在有一种克制不住的好奇的话<br>
            🔍 小红书搜索："新火相传"。<br>
            
        </p>
        <a href="/endjourney" class="back-btn pixel-text">
            <i class="fas fa-fire"></i> 结束旅程
        </a>
        <p class="pixel-text" style="margin-top: 20px; text-align: center;">
            奇妙交流Red note:新火相传测试
        </p>
    </div>
    <script src="/js/history.js"></script>
    <script src="/js/background.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initBackgroundAnimation();
        });
    </script>
</body>
</html>
